<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salgados App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main-header" style="display: none;">
        <div>🥟 <strong>Salgados</strong></div>
        <div id="user-info">
            <span id="header-name"></span>
            <button class="btn-sm" onclick="app.logout()">Sair</button>
        </div>
    </header>

    <main id="app-container">
        <!-- Renderizado pelo JS -->
    </main>

    <!-- Modal Base (In-page) -->
    <div id="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <div id="modal-body" style="margin-top: 1rem;"></div>
            <div class="flex-end" style="margin-top: 1.5rem; gap: 0.5rem;">
                <button class="btn-secondary" onclick="app.closeModal()">Cancelar</button>
                <button class="btn-primary" id="modal-submit">Salvar</button>
            </div>
            <div id="modal-error" class="error-text"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
